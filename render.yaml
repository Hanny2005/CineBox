# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: cinebox
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: CineBox
      - key: APP_DEMO
        value: "true"
      - key: APP_LOCALE
        value: vi
      - key: APP_TIMEZONE
        value: Asia/Ho_Chi_Minh
      # Mặc định SQLite (dữ liệu mẫu tạo lại mỗi lần khởi động).
      # Muốn dùng Supabase: đổi DB_CONNECTION=pgsql và thêm DB_URL trong Render > Environment.
      - key: DB_CONNECTION
        value: sqlite
